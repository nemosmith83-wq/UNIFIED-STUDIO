// Local API adapter: image generation is a remote Pollinations service; script parsing remains local.
const __origFetch = window.fetch.bind(window);
window.__comicsApiFetch = async function(input, init) {
  const url = typeof input === 'string' ? input : (input && input.url) || '';
  if (url.endsWith('/api/ai/image')) {
    if (window.UVS && !(await UVS.requestThirdPartyConsent(['image.pollinations.ai (prompt-based image generation; no uploaded reference image is sent by this adapter)']))) return new Response(JSON.stringify({ error: 'Third-party request cancelled by user' }), { status: 403, headers: { 'Content-Type': 'application/json' } });
    const body = init && init.body ? JSON.parse(init.body) : {};
    const prompt = body.prompt || 'CINEINK FUSION graphic novel panel';
    const ratio = body.aspectRatio || '4:3';
    const w = ratio === '16:9' ? 1280 : ratio === '1:1' ? 1024 : 1024;
    const h = ratio === '16:9' ? 720 : ratio === '1:1' ? 1024 : 768;
    const seed = Math.floor(100000 + Math.random() * 8900000);
    const cleanPrompt = encodeURIComponent(prompt + ', CINEINK FUSION style, bold hand-inked contours, dramatic cinematic lighting, no text, no speech bubbles, masterpiece');
    const imgUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=${w}&height=${h}&seed=${seed}&model=flux&nologo=true&private=true&enhance=true`;
    return new Response(JSON.stringify({ imageUrl: imgUrl }), { status: 200, headers: { 'Content-Type': 'application/json' } });
  }
  if (url.endsWith('/api/ai/prompt')) {
    const b = init && init.body ? JSON.parse(init.body) : {};
    const chars = Array.isArray(b.characters) ? b.characters.map(c => `${c.name} (${c.visualTraits}, wearing ${c.outfit})`).join(' | ') : '';
    const loc = b.location ? `${b.location.name} (${b.location.visualPrompt || b.location.description || ''})` : '';
    const promptEn = `CINEINK FUSION graphic novel illustration (${b.artStyle || 'Modern Colored Manga'}), camera angle: ${b.cameraAngle || 'Medium Shot'}. Scene: ${b.description || ''}. Characters: ${chars}. Location: ${loc}. Bold ink lines, FUJIFILM GFX100RF color depth, strictly no speech bubbles or text.`;
    const promptAr = `تم دمج ملامح الشخصيات والموقع المرجعي تلقائياً بأسلوب CINEINK FUSION.`;
    return new Response(JSON.stringify({ promptEn, promptAr }), { status: 200, headers: { 'Content-Type': 'application/json' } });
  }
  if (url.endsWith('/api/ai/breakdown') || url.endsWith('/api/ai/upload-episode')) {
    // Return 200 empty so the component immediately uses its built-in instantScriptParser (parseArabicScriptLocally)!
    return new Response(JSON.stringify({ panels: [], pages: [] }), { status: 200, headers: { 'Content-Type': 'application/json' } });
  }
  return __origFetch(input, init);
};

const CHAR_COLORS = ['#F59E0B', '#6366F1', '#10B981', '#EC4899', '#06B6D4', '#8B5CF6'];

/**
 * Instant, deterministic Arabic script parser that splits any Arabic episode/story text
 * into structured ComicPages, ComicPanels, Characters, Locations, and Speech Bubbles.
 * Used for instant execution and as a 100% reliable fallback if the AI endpoint is slow or offline.
 */
function parseArabicScriptLocally(scriptText, existingCharacters, existingLocations, basePageOffset, sampleImages, artStyle) {
  const cleanText = scriptText.trim();
  const lines = cleanText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);

  // 1. Detect Characters from patterns like "خالد:" or "خالد (حوار):" or "(خالد)"
  const knownCharMap = new Map();
  existingCharacters.forEach(c => knownCharMap.set(c.name.trim(), c));
  const newCharacters = [];
  const registerCharacterName = rawName => {
    const cleanName = rawName.replace(/\(.*?\)/g, '').replace(/[:：\-]/g, '').trim();
    if (!cleanName || cleanName.length > 20) {
      return existingCharacters[0];
    }
    for (const [k, v] of knownCharMap.entries()) {
      if (k === cleanName || k.includes(cleanName) || cleanName.includes(k)) {
        return v;
      }
    }
    const idx = knownCharMap.size;
    const preset = pickRandomCharacterPreset();
    const created = {
      id: `char-local-${Date.now()}-${idx}`,
      name: cleanName,
      role: preset.roleAr,
      emoji: idx % 2 === 0 ? '👦' : '🧑',
      color: CHAR_COLORS[idx % CHAR_COLORS.length],
      visualTraits: preset.visualTraits,
      outfit: preset.outfit,
      avatarUrl: existingCharacters[idx % Math.max(1, existingCharacters.length)]?.avatarUrl || '',
      hasCustomReferenceImage: false,
      fallbackMode: 'prompt',
      defaultAnchorX: idx % 2 === 0 ? 75 : 25,
      defaultAnchorY: 24
    };
    knownCharMap.set(cleanName, created);
    newCharacters.push(created);
    return created;
  };

  // 2. Group script lines into scene blocks (Panels)

  const sceneBlocks = [];
  let currentBlock = null;
  for (const line of lines) {
    const isSceneHeading = /^(مشهد|لقطة|بانل|صفحة|Scene|Panel)/i.test(line) || line.includes(' - ') && line.length < 75;
    const isSfxLine = /^(مؤثر صوتي|صوت|SFX)\s*[:：]/i.test(line);
    const isNarrationLine = /^(سرد|راوي|الراوي)\s*[:：]/i.test(line);
    const dialogueMatch = line.match(/^([^:：]{2,22})\s*[:：]\s*(.+)$/);
    if (isSceneHeading) {
      if (currentBlock) {
        sceneBlocks.push(currentBlock);
      }
      const parts = line.split(/[-–:：]/);
      const locHint = parts.length > 1 ? parts.slice(1).join(' ').trim() : line;
      currentBlock = {
        title: line.slice(0, 45),
        description: line,
        dialogue: '',
        dialogueType: 'dialogue',
        speakerName: '',
        sfxText: '',
        locationHint: locHint
      };
    } else if (isSfxLine) {
      const sfxVal = line.replace(/^(مؤثر صوتي|صوت|SFX)\s*[:：]/i, '').trim();
      if (!currentBlock) {
        currentBlock = {
          title: 'لقطة مؤثر صوتي',
          description: line,
          dialogue: '',
          dialogueType: 'dialogue',
          speakerName: '',
          sfxText: sfxVal,
          locationHint: ''
        };
      } else {
        currentBlock.sfxText = sfxVal;
      }
    } else if (isNarrationLine) {
      const narVal = line.replace(/^(سرد|راوي|الراوي)\s*[:：]/i, '').trim();
      if (!currentBlock) {
        currentBlock = {
          title: 'سرد المشهد',
          description: narVal,
          dialogue: narVal,
          dialogueType: 'narration',
          speakerName: '',
          sfxText: '',
          locationHint: ''
        };
      } else if (!currentBlock.dialogue) {
        currentBlock.dialogue = narVal;
        currentBlock.dialogueType = 'narration';
      } else {
        sceneBlocks.push(currentBlock);
        currentBlock = {
          title: 'لقطة سردية',
          description: narVal,
          dialogue: narVal,
          dialogueType: 'narration',
          speakerName: '',
          sfxText: '',
          locationHint: ''
        };
      }
    } else if (dialogueMatch) {
      const speakerRaw = dialogueMatch[1].trim();
      const spokenText = dialogueMatch[2].trim();
      const isThought = speakerRaw.includes('تفكير') || speakerRaw.includes('همس');
      const charObj = registerCharacterName(speakerRaw);
      if (!currentBlock) {
        currentBlock = {
          title: `حوار ${charObj?.name || speakerRaw}`,
          description: `${charObj?.name || speakerRaw} يتحدث في المشهد: ${spokenText}`,
          dialogue: spokenText,
          dialogueType: isThought ? 'thought' : 'dialogue',
          speakerName: charObj?.name || speakerRaw,
          sfxText: '',
          locationHint: ''
        };
      } else if (!currentBlock.dialogue) {
        currentBlock.dialogue = spokenText;
        currentBlock.dialogueType = isThought ? 'thought' : 'dialogue';
        currentBlock.speakerName = charObj?.name || speakerRaw;
      } else {
        sceneBlocks.push(currentBlock);
        currentBlock = {
          title: `لقطة ${charObj?.name || speakerRaw}`,
          description: `${charObj?.name || speakerRaw} في لقطة تفاعلية: ${spokenText}`,
          dialogue: spokenText,
          dialogueType: isThought ? 'thought' : 'dialogue',
          speakerName: charObj?.name || speakerRaw,
          sfxText: '',
          locationHint: currentBlock.locationHint
        };
      }
    } else {
      // Descriptive paragraph
      if (!currentBlock) {
        currentBlock = {
          title: line.slice(0, 36),
          description: line,
          dialogue: '',
          dialogueType: 'dialogue',
          speakerName: '',
          sfxText: '',
          locationHint: ''
        };
      } else if (currentBlock.description === currentBlock.title) {
        currentBlock.description = line;
      } else if (!currentBlock.dialogue && line.length < 110) {
        currentBlock.dialogue = line;
        currentBlock.dialogueType = 'narration';
      } else {
        sceneBlocks.push(currentBlock);
        currentBlock = {
          title: line.slice(0, 36),
          description: line,
          dialogue: '',
          dialogueType: 'dialogue',
          speakerName: '',
          sfxText: '',
          locationHint: ''
        };
      }
    }
  }
  if (currentBlock) {
    sceneBlocks.push(currentBlock);
  }

  // Ensure at least 4 panels if text was very short
  while (sceneBlocks.length < 4) {
    const idx = sceneBlocks.length + 1;
    sceneBlocks.push({
      title: `اللقطة ${idx}`,
      description: cleanText || `مشهد درامي رقم ${idx}`,
      dialogue: idx === 1 ? cleanText.slice(0, 80) : '',
      dialogueType: 'dialogue',
      speakerName: existingCharacters[0]?.name || 'خالد',
      sfxText: '',
      locationHint: ''
    });
  }
  const allChars = [...existingCharacters, ...newCharacters];
  const newLocations = [];
  const allLocations = [...existingLocations];
  if (allLocations.length === 0) {
    const locPreset = pickRandomLocationPreset();
    const fallbackLoc = {
      id: `loc-local-${Date.now()}`,
      name: 'موقع المشهد الرئيسي',
      description: locPreset.descriptionAr,
      visualPrompt: locPreset.visualPrompt,
      imageUrl: sampleImages[0] || '',
      hasCustomReferenceImage: false,
      fallbackMode: 'prompt'
    };
    newLocations.push(fallbackLoc);
    allLocations.push(fallbackLoc);
  }

  // 3. Chunk sceneBlocks into pages of 4 panels each
  const PANELS_PER_PAGE = 4;
  const generatedPages = [];
  for (let i = 0; i < sceneBlocks.length; i += PANELS_PER_PAGE) {
    const chunk = sceneBlocks.slice(i, i + PANELS_PER_PAGE);
    const pageNumber = basePageOffset + generatedPages.length + 1;
    const pagePanels = [];
    const pageOverlays = [];
    const bubbleCoords = [{
      x: 80,
      y: 11,
      tx: 75,
      ty: 23
    }, {
      x: 50,
      y: 12,
      tx: 50,
      ty: 24
    }, {
      x: 20,
      y: 11,
      tx: 25,
      ty: 23
    }, {
      x: 52,
      y: 68,
      tx: 64,
      ty: 60
    }];
    chunk.forEach((block, pIdx) => {
      const panelId = `panel-loc-${pageNumber}-${pIdx + 1}-${Date.now()}`;
      const panelNumber = `${pageNumber}.${pIdx + 1}`;
      const span = chunk.length === 4 && pIdx < 3 ? '1/3' : chunk.length === 4 && pIdx === 3 ? 'full' : chunk.length === 2 ? 'full' : '1/2';
      const cameraAngles = ['لقطة متوسطة (Medium Shot)', 'لقطة قريبة درامية (Close-Up)', 'من فوق الكتف (Over the Shoulder)', 'زاوية بانورامية واسعة (Wide Panoramic)'];
      const cameraAngle = cameraAngles[pIdx % cameraAngles.length];

      // Match characters mentioned in description or speaker
      const matchedChars = allChars.filter(c => block.speakerName && block.speakerName.includes(c.name) || block.description.includes(c.name) || block.title.includes(c.name));
      const finalChars = matchedChars.length > 0 ? matchedChars : [allChars[0]].filter(Boolean);
      const linkedLoc = allLocations[pIdx % allLocations.length];

      // Build reference-linked prompt
      const charPromptStr = finalChars.map(c => `${c.name} (${c.visualTraits}, wearing ${c.outfit})`).join('; ');
      const locPromptStr = linkedLoc ? `Location: ${linkedLoc.name} (${linkedLoc.visualPrompt})` : '';
      const promptEn = `Graphic novel and modern manga illustration (${artStyle}), no text: ${block.description}. Camera: ${cameraAngle}. Characters: ${charPromptStr}. ${locPromptStr}`;
      pagePanels.push({
        id: panelId,
        panelNumber,
        title: block.title,
        description: block.description,
        cameraAngle,
        span,
        heightClass: span === 'full' ? 'wide' : 'normal',
        characterIds: finalChars.map(c => c.id),
        locationId: linkedLoc?.id,
        initialDialogue: block.dialogue,
        promptEn,
        imageUrl: linkedLoc?.hasCustomReferenceImage && linkedLoc.imageUrl ? linkedLoc.imageUrl : sampleImages[pIdx % Math.max(1, sampleImages.length)] || ''
      });
      const coord = bubbleCoords[pIdx % bubbleCoords.length];
      if (block.dialogue) {
        pageOverlays.push({
          id: `ov-loc-${pageNumber}-${pIdx + 1}-${Date.now()}`,
          panelId,
          text: block.dialogue,
          type: block.dialogueType,
          characterId: finalChars[0]?.id || '',
          fontFamily: block.dialogueType === 'narration' ? 'amiri' : block.dialogueType === 'thought' ? 'naskh' : 'kufi',
          fontSize: 14,
          isBold: true,
          isItalic: false,
          textAlign: block.dialogueType === 'narration' ? 'right' : 'center',
          x: coord.x,
          y: coord.y,
          width: span === 'full' ? 215 : 175,
          tailTargetX: coord.tx,
          tailTargetY: coord.ty,
          hasTail: block.dialogueType === 'dialogue' || block.dialogueType === 'thought'
        });
      }
      if (block.sfxText) {
        pageOverlays.push({
          id: `ov-sfx-loc-${pageNumber}-${pIdx + 1}-${Date.now()}`,
          panelId,
          text: block.sfxText,
          type: 'sfx',
          characterId: finalChars[0]?.id || '',
          fontFamily: 'sfx',
          fontSize: 18,
          isBold: true,
          isItalic: true,
          textAlign: 'center',
          x: Math.max(12, coord.x - 10),
          y: Math.min(88, coord.y + 18),
          width: 115,
          tailTargetX: coord.x,
          tailTargetY: coord.y,
          hasTail: false,
          rotation: -8,
          color: '#EF4444'
        });
      }
    });
    generatedPages.push({
      id: `page-loc-${pageNumber}-${Date.now()}`,
      pageNumber,
      title: `الصفحة ${pageNumber}: ${chunk[0]?.title || 'مشاهد الحلقة'}`,
      settings: {
        gutterSize: 12,
        borderWidth: 3,
        paperColor: '#FFFFFF',
        showPanelNumbers: true,
        layoutPreset: 'classic-3-1'
      },
      panels: pagePanels,
      overlays: pageOverlays
    });
  }
  return {
    extractedScript: cleanText,
    newCharacters,
    newLocations,
    generatedPages
  };
}

// === MODULE: exportPageCanvas (src/utils/exportPageCanvas.ts) ===

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = err => reject(err);
    img.src = src;

/**
 * Helper that builds a merged generation prompt combining:
 * 1. Scene action & camera angle from script breakdown
 * 2. Linked Characters' visual traits & outfits (or random fallback)
 * 3. Linked Location's visual prompt & uploaded reference indicator
 */
function buildMergedPromptWithReferences(panel, allCharacters, allLocations, artStyle) {
  const linkedChars = allCharacters.filter(c => panel.characterIds.includes(c.id));
  const linkedLoc = allLocations.find(l => l.id === panel.locationId);
  const charParts = linkedChars.map(c => {
    const traits = c.fallbackMode === 'random' && !c.visualTraits.trim() ? pickRandomCharacterPreset().visualTraits : c.visualTraits;
    const outfit = c.fallbackMode === 'random' && !c.outfit.trim() ? pickRandomCharacterPreset().outfit : c.outfit;
    const refTag = c.hasCustomReferenceImage ? ' [Uploaded Character Ref Image]' : '';
    return `${c.name}${refTag}: (${traits}, wearing ${outfit})`;
  });
  const locPart = linkedLoc ? `Setting/Location (${linkedLoc.name}${linkedLoc.hasCustomReferenceImage ? ' - Uploaded Location Ref Image' : ''}): ${linkedLoc.visualPrompt || linkedLoc.description}` : '';
  const baseScene = panel.description || panel.title;
  const mergedPromptEn = [`Graphic novel and modern manga panel (${artStyle}), no text or speech bubbles:`, `Scene Action (${panel.cameraAngle}): ${baseScene}.`, charParts.length > 0 ? `Characters in Panel (Reference Linked): ${charParts.join(' | ')}.` : '', locPart ? `${locPart}.` : '', `Crisp black ink outlines, expressive lighting, high consistency.`].filter(Boolean).join(' ');
  const charNamesAr = linkedChars.map(c => c.name).join('، ') || 'بدون شخصيات محددة';
  const locNameAr = linkedLoc ? linkedLoc.name : 'تلقائي من المشهد';
  const summaryAr = `مربوط بـ: الشخصيات (${charNamesAr}) · الموقع (${locNameAr})`;
  return {
    mergedPromptEn,
    summaryAr
  };
}

/**

function autoDetectReferencesFromScript(panel, allCharacters, allLocations, panelIdx) {
  const searchSpace = `${panel.title} ${panel.description} ${panel.initialDialogue}`;

  // Match characters whose Arabic name appears in the panel's text
  const detectedCharIds = allCharacters.filter(c => c.name && searchSpace.includes(c.name.trim())).map(c => c.id);
  const finalCharIds = detectedCharIds.length > 0 ? detectedCharIds : panel.characterIds.length > 0 ? panel.characterIds : [allCharacters[0]?.id].filter(Boolean);

  // Match location whose name or keywords appear in the panel's text
  let matchedLoc = allLocations.find(l => {
    const keywords = l.name.split(/\s+/).filter(w => w.length > 3);
    return searchSpace.includes(l.name) || keywords.some(kw => searchSpace.includes(kw));
  });
  if (!matchedLoc && allLocations.length > 0) {
    matchedLoc = allLocations.find(l => l.id === panel.locationId) || allLocations[panelIdx % allLocations.length];
  }
  return {
    characterIds: finalCharIds,
    locationId: matchedLoc?.id
  };
