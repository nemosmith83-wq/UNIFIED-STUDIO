name: Docker Build and Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag unified-studio-test .

      - name: Start container and verify health + frontend
        run: |
          docker run --detach --name unified-studio-test \
            --publish 127.0.0.1:8000:8000 \
            --env PORT=8000 \
            --env COOKIE_SECURE_ONLY=false \
            --env ALLOW_REGISTRATION=true \
            --env ENABLE_CODE_EXECUTION=false \
            unified-studio-test

          python - <<'PY'
          import json
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          base = "http://127.0.0.1:8000"
          last_error = None
          for _ in range(45):
              try:
                  with urlopen(base + "/health", timeout=2) as response:
                      health = json.loads(response.read().decode("utf-8"))
                      assert response.status == 200 and health.get("ok") is True, health
                  with urlopen(base + "/", timeout=3) as response:
                      html = response.read().decode("utf-8", errors="replace")
                      assert response.status == 200 and "<html" in html.lower(), "Frontend HTML did not load"
                  print("PASS: container health endpoint and frontend route responded.")
                  break
              except (URLError, TimeoutError, AssertionError, ValueError, OSError) as exc:
                  last_error = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"Container smoke test failed: {last_error}")
          PY

      - name: Exercise authenticated API CRUD and local routes
        run: |
          python - <<'PY'
          import json, time, uuid
          from urllib.request import Request, build_opener
          from urllib.error import HTTPError
          from http.cookiejar import CookieJar

          base = "http://127.0.0.1:8000"
          jar = CookieJar()
          opener = build_opener(__import__("urllib.request").request.HTTPCookieProcessor(jar))

          def call(path, method="GET", payload=None, expected=200):
              data = None if payload is None else json.dumps(payload).encode()
              req = Request(base + path, data=data, method=method,
                            headers={"Content-Type":"application/json"} if data else {})
              try:
                  with opener.open(req, timeout=8) as response:
                      raw=response.read()
                      assert response.status == expected, (path,response.status)
              except HTTPError as e:
                  raw=e.read()
                  assert e.code == expected, (path,e.code,raw[:300])
              if path == "/promptvault" or path.startswith("/guides/"):
                  return raw
              return json.loads(raw)

          # Verify auth wall before creating a disposable CI-only user.
          try:
              opener.open(base + "/api/config", timeout=5)
              raise AssertionError("Unauthenticated /api/config was not blocked")
          except HTTPError as e:
              assert e.code == 401
          status=call("/api/auth/status")
          assert status.get("authenticated") is False

          username="qa_"+uuid.uuid4().hex[:12]
          reg=call("/api/auth/register","POST",{
              "username":username,"display_name":"CI QA","password":"TestPass-2026-Strong!"
          })
          assert reg.get("success") and reg.get("user",{}).get("username")==username
          assert call("/api/auth/status").get("authenticated") is True
          call("/api/auth/logout","POST")
          login=call("/api/auth/login","POST",{
              "username":username,"password":"TestPass-2026-Strong!"
          })
          assert login.get("success") and call("/api/auth/status").get("authenticated") is True

          cfg=call("/api/config")
          assert "engines" in cfg and "agents" in cfg and "providers" in cfg
          assert call("/api/status").get("status")=="healthy"
          assert isinstance(call("/api/providers/health"),dict)
          assert isinstance(call("/api/providers/fallback").get("chain"),list)
          assert isinstance(call("/api/sessions").get("sessions"),list)

          # User-scoped memory create/read/delete.
          key="ci_qa_"+uuid.uuid4().hex[:8]
          assert call("/api/memories","POST",{"key":key,"value":{"check":"passed"}}).get("success")
          assert call("/api/memories").get("memories",{}).get(key,{}).get("value")=={"check":"passed"}
          assert call("/api/memories/"+key,"DELETE").get("success")

          # Automation create/run/delete.
          automation=call("/api/automations","POST",{
              "name":"CI QA automation","trigger_type":"manual","schedule":"","action":"test"
          })["automation"]
          assert call("/api/automations/"+automation["id"]+"/run","POST").get("success")
          assert call("/api/automations/"+automation["id"],"DELETE").get("success")

          # Workflow create/run and verify each step result.
          workflow=call("/api/workflows","POST",{
              "name":"CI QA workflow","steps":[{"name":"QA step 1"},{"name":"QA step 2"}]
          })["workflow"]
          results=call("/api/workflows/"+workflow["id"]+"/run","POST").get("results",[])
          assert len(results)==2 and all(x.get("status")=="completed" for x in results)

          # Authenticated local PromptVault and PDF guide routes.
          html=call("/promptvault")
          assert b"html" in html.lower()
          guide=call("/guides/RVC-Voice-Cloning-Mobile-Guide-AR.pdf")
          assert guide[:4]==b"%PDF"

          call("/api/auth/logout","POST")
          assert call("/api/auth/status").get("authenticated") is False
          print("PASS: auth/register/login-session/logout, auth wall, config/status/provider/fallback reads, session list, memory CRUD, automation CRUD/run, workflow create/run, PromptVault and PDF guide routes.")
          PY

      - name: Print container logs on failure
        if: failure()
        run: docker logs unified-studio-test || true

      - name: Remove test container
        if: always()
        run: docker rm --force unified-studio-test || true
