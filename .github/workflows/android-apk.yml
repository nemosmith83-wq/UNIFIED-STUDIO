name: Build Unified Studio APK
on:
  workflow_dispatch:
  push:
    paths:
      - "android_app/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android platform and build tools
        run: yes | sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android_app
        run: gradle assembleDebug --no-daemon
      - name: Publish APK as downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-latest
          name: Unified Studio APK
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: android_app/app/build/outputs/apk/debug/app-debug.apk
