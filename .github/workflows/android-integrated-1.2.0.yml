name: Build Unified Studio Android 1.2.0 Integrated APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-integrated-1.2.0.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
          test -d "$SDK_ROOT/platforms/android-35"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          echo "Android 35 SDK and build-tools 35.0.0 are ready."

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download and reconstruct corrected integrated 1.2.0 source
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --output source.part1 "https://nemo1sthelper.floot.app/_cdn/static/3de974b1-9d06-4f29-a946-34cf4b63d691-UVS_Fadel_1_2_0_final.part1"
          curl --fail --location --retry 4 --retry-all-errors --output source.part2 "https://nemo1sthelper.floot.app/_cdn/static/437013db-f86d-4bf7-9233-309ccd7d73f9-UVS_Fadel_1_2_0_final.part2"
          cat source.part1 source.part2 > integrated-source.zip
          echo "50b57a61b2d6ce692e84334b4525c88ab1fb4d231a689d2cf3f8ffaf4fbd02b3  integrated-source.zip" | sha256sum --check
          unzip -t integrated-source.zip
          mkdir source
          unzip -q integrated-source.zip -d source
          PROJECT="source/Unified_Vision_Studio_FadeL_Integrated_Source_1.2.0"
          test -s "$PROJECT/app/src/main/assets/frontend/index.html"
          test -s "$PROJECT/app/src/main/python/server.py"
          test -s "$PROJECT/app/src/main/python/android_server.py"
          test -s "$PROJECT/app/src/main/python/storyboard_store.py"
          test -s "$PROJECT/app/src/main/assets/frontend/characters/index.json"
          test -s "$PROJECT/app/src/main/assets/frontend/characters/REHAM/Originals/مكتب فاخر وبيئة مهنية أنيقة.png"
          grep -q 'BeautifulSoup' "$PROJECT/app/src/main/python/tools.py"
          ! grep -q 'ddgs==' "$PROJECT/app/build.gradle"
          echo "Verified corrected integrated source, backend, storyboard, character images and Android-compatible web-search fallback."

      - name: Set Android app version and Chaquopy build Python
        working-directory: source/Unified_Vision_Studio_FadeL_Integrated_Source_1.2.0
        run: |
          sed -i 's/versionCode 2/versionCode 3/' app/build.gradle
          sed -i "s/versionName '1.1.0'/versionName '1.2.0'/" app/build.gradle
          sed -i '/version = "3.13"/a\        buildPython "python3.13"' app/build.gradle
          sed -i 's/Pillow==11.3.0/Pillow==11.0.0/' app/build.gradle
          sed -i 's/pydantic==2.11.7/pydantic==1.10.21/' app/build.gradle
          python3.13 --version
          grep -E 'versionCode|versionName|applicationId|buildPython|Pillow|pydantic' app/build.gradle

      - name: Run source regression tests
        working-directory: source/Unified_Vision_Studio_FadeL_Integrated_Source_1.2.0
        run: |
          python -m pip install --upgrade pip pytest fastapi uvicorn pydantic python-dotenv requests Pillow beautifulsoup4 pypdf python-docx python-multipart httpx
          python -m pytest -q qa/test_android_regressions.py

      - name: Build integrated Android APK
        working-directory: source/Unified_Vision_Studio_FadeL_Integrated_Source_1.2.0
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean assembleDebug --info 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/delivery"
          cp "$APK" "$GITHUB_WORKSPACE/delivery/Unified-Studio-Android-1.2.0.apk"
          ls -lh "$GITHUB_WORKSPACE/delivery/Unified-Studio-Android-1.2.0.apk"

      - name: Verify APK signature, package and embedded app components
        run: |
          APK="delivery/Unified-Studio-Android-1.2.0.apk"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | grep -E "package: name='com.unifiedstudio.android' versionCode='3' versionName='1.2.0'|application-label:'Unified Studio'"
          unzip -l "$APK" | grep -E 'assets/(frontend/index.html|frontend/core-studio.html|python_bytecode/|chaquopy/)' | head -30
          sha256sum "$APK"
          file "$APK"

      - name: Upload verified integrated APK
        uses: actions/upload-artifact@v4
        with:
          name: Unified-Studio-Android-1.2.0-Integrated-APK
          path: delivery/Unified-Studio-Android-1.2.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unified-Studio-Android-1.2.0-Build-Logs
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
