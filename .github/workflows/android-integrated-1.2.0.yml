name: Build Unified Studio Android 1.2.0 Integrated APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-integrated-1.2.0.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
          test -d "$SDK_ROOT/platforms/android-35"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          echo "Android 35 SDK and build-tools 35.0.0 are ready."

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download and reconstruct corrected integrated 1.2.0 source
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --output source.part1 "https://nemo1sthelper.floot.app/_cdn/static/3de974b1-9d06-4f29-a946-34cf4b63d691-UVS_Fadel_1_2_0_final.part1"
          curl --fail --location --retry 4 --retry-all-errors --output source.part2 "https://nemo1sthelper.floot.app/_cdn/static/437013db-f86d-4bf7-9233-309ccd7d73f9-UVS_Fadel_1_2_0_final.part2"
          cat source.part1 source.part2 > integrated-source.zip
          echo "50b57a61b2d6ce692e84334b4525c88ab1fb4d231a689d2cf3f8ffaf4fbd02b3  integrated-source.zip" | sha256sum --check
          unzip -t integrated-source.zip
          mkdir source
          unzip -q integrated-source.zip -d source
          PROJECT="source/Unified_Vision_Studio_FadeL_Integrated_Source_1.2.0"
          test -s "$PROJECT/app/src/main/assets/frontend/index.html"
          test -s "$PROJECT/app/src/main/python/server.py"
          test -s "$PROJECT/app/src/main/python/android_server.py"
          test -s "$PROJECT/app/src/main/python/storyboard_store.py"
          test -s "$PROJECT/app/src/main/assets/frontend/characters/index.json"
          test -s "$PROJECT/app/src/main/assets/frontend/characters/REHAM/Originals/مكتب فاخر وبيئة مهنية أنيقة.png"
          grep -q 'BeautifulSoup' "$PROJECT/app/src/main/python/tools.py"
          ! grep -q 'ddgs==' "$PROJECT/app/build.gradle"
          echo "Verified corrected integrated source, backend, storyboard, character images and Android-compatible web-search fallback."

      - name: Merge FadeL The New Era v16 and supplemental tools into the Android app
        run: |
          set -euo pipefail
          PROJECT="source/Unified_Vision_Studio_FadeL_Integrated_Source_1.2.0"
          FRONTEND="$PROJECT/app/src/main/assets/frontend"
          NEWERA="$FRONTEND/new-era"
          mkdir -p "$NEWERA"

          # The New Era v16 web/PWA source already used by this repository's APK workflow.
          curl --fail --location --retry 4 --retry-all-errors --output new-era-v16.zip "https://nemo1sthelper.floot.app/_cdn/static/39c5ed47-f0fc-40dd-bdc8-8b23c5ea43ab-UVS_Fadel_v16_source.zip"
          unzip -t new-era-v16.zip
          unzip -q new-era-v16.zip -d "$NEWERA"
          test -s "$NEWERA/index.html"

          # Supplementary tools and references uploaded to the user's Floot project.
          curl --fail --location --retry 4 --retry-all-errors --output new-era-tools.zip "https://fadel0newera.floot.app/_cdn/static/a96bfed9-8df1-45f0-9451-8166d5336b6a-the_new_era_unified_tools.zip"
          echo "a8bd765b2d17da1f0df61b346020aea75077847b0d9db41f7e70a5347ec3ca43  new-era-tools.zip" | sha256sum --check
          unzip -t new-era-tools.zip
          unzip -q new-era-tools.zip -d "$NEWERA"
          cp frontend/new-era/unified-launcher.html "$NEWERA/unified-launcher.html"

          # Replace the packaged Stable Diffusion studio page with the corrected
          # API-origin version. The SD web server runs on :8766, while the app
          # API runs on :8765.
          SD_PAGE="$PROJECT/app/src/main/assets/frontend/user_studios/Stable_Diffusion_Mobile_PRO_v14.html"
          mkdir -p "$(dirname "$SD_PAGE")"
          cp "$GITHUB_WORKSPACE/frontend/user_studios/Stable_Diffusion_Mobile_PRO_v14.html" "$SD_PAGE"

          # Permit the packaged SD UI origin to call the local Unified Studio API.
          BACKEND="$PROJECT/app/src/main/python/server.py"
          python - "$BACKEND" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          if "http://127.0.0.1:8766" not in text:
              start = text.find("allow_origins")
              bracket = text.find("[", start)
              if start < 0 or bracket < 0:
                  raise SystemExit("Could not locate backend CORS allow_origins list")
              additions = '\n        "http://127.0.0.1:8766", "http://localhost:8766",'
              text = text[:bracket + 1] + additions + text[bracket + 1:]
              path.write_text(text, encoding="utf-8")
          PY
          grep -q "localSdApiUrl('/api/local-sd/status')" "$SD_PAGE"
          grep -q "http://127.0.0.1:8766" "$BACKEND"
          echo "Patched Stable Diffusion UI API origin and local-only CORS."

          test -s "$NEWERA/tools/Comics_Studio_RTL_PRO_v14.html"
          test -s "$NEWERA/tools/PromptVault-Pro-Ultimate-Bilingual-v13-RVC-Integrated.html"
          test -s "$NEWERA/resources/RVC_Free_Mobile_Tool_Colab_FIXED.ipynb"
          # Remove optional shared-core script references from standalone tool pages.
          # The bridge is not part of the supplied tools pack; Comics Studio already has a localStorage fallback.
          python - <<'PY'
          import re
          from pathlib import Path
          tools = Path("source/Unified_Vision_Studio_FadeL_Integrated_Source_1.2.0/app/src/main/assets/frontend/new-era/tools")
          pattern = re.compile(r"""<script\b[^>]*\bsrc=["'][^"']*uvs-core\.js[^"']*["'][^>]*>\s*</script>""", re.I)
          removed = 0
          for page in tools.rglob("*.html"):
              text = page.read_text(encoding="utf-8")
              updated, count = pattern.subn("", text)
              if count:
                  page.write_text(updated, encoding="utf-8")
                  removed += count
          if removed != 8:
              raise SystemExit(f"Expected to remove 8 missing optional uvs-core.js references, removed {removed}")
          print("Removed 8 unresolved optional shared-core references; standalone fallback remains enabled.")
          PY

          # Add a visible entry in the integrated studio navigation without removing existing tabs.
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["GITHUB_WORKSPACE"]) / "source/Unified_Vision_Studio_FadeL_Integrated_Source_1.2.0/app/src/main/assets/frontend/index.html"
          s = p.read_text(encoding="utf-8")
          link = '<a class="nav-btn" href="/new-era/unified-launcher.html">FadeL The New Era + Tools</a>'
          if link not in s:
              start = s.find('<nav class="nav-tabs">')
              if start >= 0:
                  end = s.find('</nav>', start)
                  if end >= 0:
                      s = s[:end] + link + s[end:]
                  else:
                      raise SystemExit("Navigation closing tag not found")
              else:
                  s = s.replace('</body>', '<a href="/new-era/unified-launcher.html" style="position:fixed;z-index:99999;bottom:16px;right:16px;padding:12px 16px;background:#d9a85e;color:#17120b;border-radius:12px;font-weight:800;text-decoration:none">FadeL The New Era + Tools</a></body>')
              p.write_text(s, encoding="utf-8")
          PY
          echo "Integrated New Era source and 15 supplementary tools into Android assets."
          du -sh "$NEWERA"
      - name: Fix Android first-admin setup key synchronization
        working-directory: source/Unified_Vision_Studio_FadeL_Integrated_Source_1.2.0
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path("app/src/main/python")
          android = root / "android_server.py"
          text = android.read_text(encoding="utf-8")
          old = '    os.environ.setdefault("UVS_ADMIN_SETUP_KEY", _load_or_create_secret(os.path.join(private_dir, "uvs_admin_setup_key.txt")))'
          new = '    os.environ["UVS_ADMIN_SETUP_KEY"] = _load_or_create_secret(os.path.join(private_dir, "uvs_admin_setup_key.txt"))'
          if old not in text:
              raise SystemExit("Android setup-key initialization source not found")
          android.write_text(text.replace(old, new, 1), encoding="utf-8")

          server = root / "server.py"
          text = server.read_text(encoding="utf-8")
          old = '        return {"available": True, "setup_key": os.environ.get("UVS_ADMIN_SETUP_KEY", "")}'
          new = '''        setup_key = os.environ.get("UVS_ADMIN_SETUP_KEY", "")
                  if not setup_key:
                      raise HTTPException(status_code=503, detail="Local admin setup key unavailable.")
                  # Keep the bootstrap endpoint and the mounted API on the exact same key.
                  _admin_api.SETUP = setup_key
                  return {"available": True, "setup_key": setup_key}
          '''
          if old not in text:
              raise SystemExit("Local admin setup-key endpoint source not found")
          server.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("Patched Android setup-key persistence and API synchronization.")
          PY
          python -m py_compile app/src/main/python/android_server.py app/src/main/python/server.py app/src/main/python/uvs_admin_api.py

      - name: Set Android app version and Chaquopy build Python
        working-directory: source/Unified_Vision_Studio_FadeL_Integrated_Source_1.2.0
        run: |
          sed -i 's/versionCode 2/versionCode 3/' app/build.gradle
          sed -i "s/versionName '1.1.0'/versionName '1.2.0'/" app/build.gradle
          sed -i '/version = "3.13"/a\        buildPython "python3.13"' app/build.gradle
          sed -i 's/Pillow==11.3.0/Pillow==11.0.0/' app/build.gradle
          sed -i 's/pydantic==2.11.7/pydantic==1.10.21/' app/build.gradle
          python3.13 --version
          grep -E 'versionCode|versionName|applicationId|buildPython|Pillow|pydantic' app/build.gradle

      - name: Run source regression tests
        working-directory: source/Unified_Vision_Studio_FadeL_Integrated_Source_1.2.0
        run: |
          python -m pip install --upgrade pip pytest fastapi uvicorn pydantic python-dotenv requests Pillow beautifulsoup4 pypdf python-docx python-multipart httpx
          python -m pytest -q qa/test_android_regressions.py
          python qa/run_integration_smoke.py

      - name: Build integrated Android APK
        working-directory: source/Unified_Vision_Studio_FadeL_Integrated_Source_1.2.0
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean assembleDebug --info 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/delivery"
          cp "$APK" "$GITHUB_WORKSPACE/delivery/Unified-Studio-Android-1.2.0.apk"
          ls -lh "$GITHUB_WORKSPACE/delivery/Unified-Studio-Android-1.2.0.apk"

      - name: Verify APK signature, package and embedded app components
        run: |
          set -euo pipefail
          APK="delivery/Unified-Studio-Android-1.2.0.apk"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | grep -E "package: name='com.unifiedstudio.android' versionCode='3' versionName='1.2.0'|application-label:'Unified Studio'"
          unzip -l "$APK" | grep -E 'assets/(frontend/index.html|frontend/core-studio.html|python_bytecode/|chaquopy/)' | head -30
          unzip -l "$APK" | grep -F 'assets/frontend/new-era/index.html'
          unzip -l "$APK" | grep -F 'assets/frontend/new-era/unified-launcher.html'
          unzip -l "$APK" | grep -F 'assets/frontend/new-era/tools/Comics_Studio_RTL_PRO_v14.html'
          unzip -l "$APK" | grep -F 'assets/frontend/new-era/tools/PromptVault-Pro-Ultimate-Bilingual-v13-RVC-Integrated.html'
          unzip -l "$APK" | grep -F 'assets/frontend/new-era/resources/promptvault-pages/PromptVault-Pro-page-18.jpg'
          TOOL_COUNT="$(unzip -l "$APK" | grep -cE 'assets/frontend/new-era/tools/[^ ]+\.html$')"
          test "$TOOL_COUNT" -ge 15
          echo "Verified The New Era app, launcher, 15+ standalone tools, and reference resources in the APK."
          sha256sum "$APK"
          file "$APK"

      - name: Upload verified integrated APK
        uses: actions/upload-artifact@v4
        with:
          name: Unified-Studio-Android-1.2.0-Integrated-APK
          path: delivery/Unified-Studio-Android-1.2.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unified-Studio-Android-1.2.0-Build-Logs
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
