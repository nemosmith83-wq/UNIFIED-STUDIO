name: Build native Unified Studio Android APK

on:
  push:
    paths:
      - "android-native/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/android-native.yml"
  workflow_run:
    workflows: ["Build Stable Diffusion Android ARM64 Engine"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Download compiled ARM64 engine
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: stable-diffusion-android-arm64-cpu
          path: downloaded-engine
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package native engine into Android assets
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          OUTER="downloaded-engine/stable-diffusion-android-arm64-cpu.zip"
          test -s "$OUTER"
          mkdir -p /tmp/sd-engine
          unzip -q "$OUTER" -d /tmp/sd-engine
          test -x /tmp/sd-engine/native/arm64-v8a/sd-server || chmod +x /tmp/sd-engine/native/arm64-v8a/sd-server
          test -s /tmp/sd-engine/native/arm64-v8a/libc++_shared.so
          mkdir -p android-native/app/src/main/assets/native/arm64-v8a
          cp /tmp/sd-engine/native/arm64-v8a/sd-server android-native/app/src/main/assets/native/arm64-v8a/
          cp /tmp/sd-engine/native/arm64-v8a/libc++_shared.so android-native/app/src/main/assets/native/arm64-v8a/
          file android-native/app/src/main/assets/native/arm64-v8a/sd-server

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Python 3.12 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python for Chaquopy
        run: python --version && python3.12 --version

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: android-native
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unified-studio-native-android-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
