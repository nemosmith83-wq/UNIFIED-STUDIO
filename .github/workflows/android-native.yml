name: Build native Unified Studio Android APK

on:
  workflow_run:
    workflows: ["Build Stable Diffusion Android ARM64 Engine"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-native.yml"
      - "frontend/**"
      - "backend/**"
      - "android-native/**"
      - "guides/**"

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact source that built the ARM64 engine
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download engine artifact from triggering successful engine run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: stable-diffusion-android-arm64-cpu
          path: downloaded-engine
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download last verified ARM64 engine for source-only push rebuild
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          name: stable-diffusion-android-arm64-cpu
          path: downloaded-engine
          run-id: 45418759486
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package engine as Android native libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y patchelf
          OUTER="$(find downloaded-engine -type f -name 'stable-diffusion-android-arm64-cpu.zip' -print -quit)"
          test -n "$OUTER"
          test -s "$OUTER"
          mkdir -p /tmp/sd-engine
          unzip -q "$OUTER" -d /tmp/sd-engine
          NATIVE="/tmp/sd-engine/native/arm64-v8a"
          BIN="$NATIVE/sd-server"
          test -s "$BIN"
          test -x "$BIN"

          # The engine artifact may already contain the renamed runtime, or may
          # contain the original NDK runtime. Normalize both cases safely.
          if test -s "$NATIVE/libc++_shared.so"; then
            mv "$NATIVE/libc++_shared.so" "$NATIVE/libsdserver_cxx.so"
          fi
          test -s "$NATIVE/libsdserver_cxx.so"
          patchelf --set-soname libsdserver_cxx.so "$NATIVE/libsdserver_cxx.so"
          if readelf -d "$BIN" | grep -Fq "libc++_shared.so"; then
            patchelf --replace-needed libc++_shared.so libsdserver_cxx.so "$BIN"
          fi

          readelf -h "$BIN" | grep -F "AArch64"
          readelf -d "$BIN" | grep -F "libsdserver_cxx.so"
          ! readelf -d "$BIN" | grep -F "libc++_shared.so"

          DEST="android-native/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          cp "$BIN" "$DEST/libsd-server.so"
          cp "$NATIVE/libsdserver_cxx.so" "$DEST/libsdserver_cxx.so"
          chmod 755 "$DEST/libsd-server.so" "$DEST/libsdserver_cxx.so"
          test -s "$DEST/libsd-server.so"
          test -s "$DEST/libsdserver_cxx.so"
          file "$DEST/libsd-server.so" "$DEST/libsdserver_cxx.so"
          sha256sum "$DEST"/*.so

      - name: Stage integrated Unified Hub and The New Era tools into native APK
        run: |
          set -euo pipefail
          # Reconstruct the corrected Unified Studio 1.2.0 source package.
          curl --fail --location --retry 4 --retry-all-errors --output source.part1 "https://nemo1sthelper.floot.app/_cdn/static/3de974b1-9d06-4f29-a946-34cf4b63d691-UVS_Fadel_1_2_0_final.part1"
          curl --fail --location --retry 4 --retry-all-errors --output source.part2 "https://nemo1sthelper.floot.app/_cdn/static/437013db-f86d-4bf7-9233-309ccd7d73f9-UVS_Fadel_1_2_0_final.part2"
          cat source.part1 source.part2 > integrated-source.zip
          echo "50b57a61b2d6ce692e84334b4525c88ab1fb4d231a689d2cf3f8ffaf4fbd02b3  integrated-source.zip" | sha256sum --check
          unzip -t integrated-source.zip
          mkdir -p integrated-source
          unzip -q integrated-source.zip -d integrated-source
          PROJECT="integrated-source/Unified_Vision_Studio_FadeL_Integrated_Source_1.2.0"
          HUB_SOURCE="$PROJECT/app/src/main/assets/frontend/unified-hub"
          test -s "$HUB_SOURCE/index.html"
          rm -rf frontend/unified-hub
          mkdir -p frontend/unified-hub
          cp -a "$HUB_SOURCE/." frontend/unified-hub/

          # Stage the v16 PWA and the complete supplemental tools/resources pack.
          cp frontend/new-era/unified-launcher.html /tmp/fadel-unified-launcher.html
          NEWERA="frontend/new-era"
          mkdir -p "$NEWERA"
          curl --fail --location --retry 4 --retry-all-errors --output new-era-v16.zip "https://nemo1sthelper.floot.app/_cdn/static/39c5ed47-f0fc-40dd-bdc8-8b23c5ea43ab-UVS_Fadel_v16_source.zip"
          unzip -t new-era-v16.zip
          unzip -q new-era-v16.zip -d "$NEWERA"
          curl --fail --location --retry 4 --retry-all-errors --output new-era-tools.zip "https://fadel0newera.floot.app/_cdn/static/a96bfed9-8df1-45f0-9451-8166d5336b6a-the_new_era_unified_tools.zip"
          echo "a8bd765b2d17da1f0df61b346020aea75077847b0d9db41f7e70a5347ec3ca43  new-era-tools.zip" | sha256sum --check
          unzip -t new-era-tools.zip
          unzip -q new-era-tools.zip -d "$NEWERA"
          # Repair the invalid quantified lookbehind in the bundled bilingual XTTS tool,
          # then syntax-check every inline JavaScript block before packaging.
          python - <<'PY'
          from pathlib import Path
          target = Path("frontend/new-era/tools/XTTS_v2_Bilingual_Voice_Studio.html")
          if not target.is_file():
              raise SystemExit(f"Expected bundled XTTS page missing: {target}")
          text = target.read_text(encoding="utf-8")
          old = r"(?<=[.!?؟।\n])+"
          new = r"(?<=[.!?؟।\n])"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one invalid XTTS lookbehind, found {count}")
          target.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("Patched XTTS sentence split regex.")
          PY
          # Define the Scissors icon used by the Comics Studio in all staged copies.
          python - <<'PY'
          from pathlib import Path
          targets = list(Path("frontend/new-era").rglob("Comics_Studio_RTL_PRO_v14.html"))
          targets += list(Path("frontend/user_studios").rglob("Comics_Studio_RTL_PRO_v14.html"))
          if len(targets) != 3:
              raise SystemExit(f"Expected 3 packaged Comics Studio copies, found {len(targets)}")
          anchor = "const Printer = Save;"
          definition = """const Scissors = makeIcon('<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><path d="M14.8 14.8 20 20"/>'); const User = makeIcon('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'); const AlignCenter = makeIcon('<path d="M3 6h18M6 10h12M3 14h18M6 18h12"/>'); const AlignLeft = makeIcon('<path d="M3 6h18M3 10h12M3 14h18M3 18h12"/>'); const AlignRight = makeIcon('<path d="M3 6h18M9 10h12M3 14h18M9 18h12"/>'); const ArrowDown = makeIcon('<path d="M12 5v14M19 12l-7 7-7-7"/>'); const ArrowUp = makeIcon('<path d="M12 19V5M5 12l7-7 7 7"/>'); const Bold = makeIcon('<path d="M6 4h7a4 4 0 0 1 0 8H6z"/><path d="M6 12h8a4 4 0 0 1 0 8H6z"/>'); const Cloud = makeIcon('<path d="M20 16.2A4.5 4.5 0 0 0 18 7.7 6 6 0 0 0 6.2 9.5 4.5 4.5 0 0 0 7 18h12"/>'); const FileSpreadsheet = makeIcon('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8M12 13v4"/>'); const Italic = makeIcon('<path d="M19 4h-9M14 20H5M15 4 9 20"/>'); const PlusCircle = makeIcon('<circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/>'); const Settings = makeIcon('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 2.9-.2-.1a1.7 1.7 0 0 0-1.8-.2 1.7 1.7 0 0 0-1 1.5v.2h-3.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.2l-.2.1L7 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H5.7v-3.4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L7 7.6l1.7-2.9.2.1a1.7 1.7 0 0 0 1.8.2 1.7 1.7 0 0 0 1-1.5v-.2h3.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.2l.2-.1 1.7 2.9-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1z"/>');"""
          for page in targets:
              text = page.read_text(encoding="utf-8")
              if text.count(anchor) != 1:
                  raise SystemExit(f"Expected one icon insertion point in {page}")
              if "const Scissors = makeIcon(" in text:
                  raise SystemExit(f"Scissors icon already defined in {page}")
              page.write_text(text.replace(anchor, anchor + "\n" + definition, 1), encoding="utf-8")
          print("Added missing Scissors icon to all 3 Comics Studio copies.")
          PY
          python - <<'PY'
          import subprocess, tempfile
          from pathlib import Path
          from html.parser import HTMLParser
          roots = [Path("frontend/new-era/tools"), Path("frontend/user_studios"), Path("frontend/unified-hub")]
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.blocks = []
                  self.active = None
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.active = (dict(attrs), [])
              def handle_data(self, data):
                  if self.active is not None:
                      self.active[1].append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active is not None:
                      self.blocks.append(self.active)
                      self.active = None
          checked = 0
          failures = []
          for root in roots:
              if not root.exists():
                  continue
              for page in root.rglob("*.html"):
                  parser = Scripts()
                  parser.feed(page.read_text(encoding="utf-8", errors="replace"))
                  for index, (attrs, parts) in enumerate(parser.blocks):
                      kind = attrs.get("type", "").lower()
                      if attrs.get("src") or kind in ("application/json", "application/ld+json", "text/template", "text/x-template"):
                          continue
                      code = "".join(parts).strip()
                      if not code:
                          continue
                      checked += 1
                      with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as f:
                          f.write(code)
                          temp = Path(f.name)
                      result = subprocess.run(["node", "--check", str(temp)], capture_output=True, text=True)
                      temp.unlink(missing_ok=True)
                      if result.returncode:
                          failures.append(f"{page} script#{index}: {(result.stderr or result.stdout).strip()}")
          if failures:
              raise SystemExit("\\n".join(failures))
          print(f"Inline JavaScript syntax audit passed: {checked} blocks.")
          PY
          cp /tmp/fadel-unified-launcher.html "$NEWERA/unified-launcher.html"
          # Make the root PromptVault panel resolve inside the local WebView
          # and expose the guides copied by the Android app under /guides.
          mkdir -p frontend/guides
          cp guides/PromptVault-Pro-Complete-Visual-Guide-AR-FINAL.pdf frontend/guides/
          cp guides/RVC-Voice-Cloning-Mobile-Guide-AR.pdf frontend/guides/
          python - <<'PY'
          from pathlib import Path
          backend = Path("backend/server.py").read_text(encoding="utf-8")
          if '@app.get("/promptvault")' not in backend or '@app.get("/guides/{filename}")' not in backend:
              raise SystemExit("Expected backend routes for PromptVault and PDF guides were not found")
          for name in (
              "PromptVault-Pro-Complete-Visual-Guide-AR-FINAL.pdf",
              "RVC-Voice-Cloning-Mobile-Guide-AR.pdf",
          ):
              if not (Path("frontend/guides") / name).is_file():
                  raise SystemExit(f"Missing staged guide for browser QA: {name}")
          print("Verified backend PromptVault/guide routes and staged guide files.")
          PY
          # Remove optional shared-core references absent from the supplied tools pack.
          python - <<'PY'
          import re
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          tools = Path("frontend/new-era/tools")
          pattern = re.compile(r"""<script\b[^>]*\bsrc=["'][^"']*uvs-core\.js[^"']*["'][^>]*>\s*</script>""", re.I)
          removed = 0
          for page in tools.rglob("*.html"):
              text = page.read_text(encoding="utf-8")
              updated, count = pattern.subn("", text)
              if count:
                  page.write_text(updated, encoding="utf-8")
                  removed += count
          if removed != 8:
              raise SystemExit(f"Expected 8 optional uvs-core.js references, removed {removed}")

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "a":
                      self.links.extend(value for key, value in attrs if key.lower() == "href" and value)
          launcher = Path("frontend/new-era/unified-launcher.html")
          parser = LinkParser()
          parser.feed(launcher.read_text(encoding="utf-8"))
          broken = []
          for href in parser.links:
              if href.startswith(("http://", "https://", "mailto:", "tel:", "#", "javascript:", "data:")):
                  continue
              target = (launcher.parent / urlsplit(href).path).resolve()
              if not target.is_file():
                  broken.append(href)
          if broken:
              raise SystemExit("Broken New Era launcher links: " + ", ".join(broken))
          print(f"New Era validation passed: removed {removed} optional references; checked {len(parser.links)} launcher links.")
          PY
          test -s "$NEWERA/index.html"
          test -s "$NEWERA/resources/uvs-vault-2026-11-18.json"
          test -s "$NEWERA/resources/SKILL.md"
          test -s "$NEWERA/tools/PromptVault-Pro-Ultimate-Bilingual-v13-RVC-Integrated.html"
          test -s "$NEWERA/resources/Ultimate_ChatGPT_Prompt_Library.pdf"
          test -s "$NEWERA/resources/Free_AI_Face_Swap_Web_Archive.mht"

          # Point the embedded hub to the app's local Stable Diffusion server
          # and local Unified Studio API ports.
          python - <<'PY'
          from pathlib import Path
          hub = Path("frontend/unified-hub/app.js")
          text = hub.read_text(encoding="utf-8")
          old = "const defaultSdBaseUrl = 'http://127.0.0.1:7860';"
          new = "const defaultSdBaseUrl = 'http://127.0.0.1:8766';"
          if old not in text:
              raise SystemExit("Unified Hub SD base URL source not found")
          hub.write_text(text.replace(old, new, 1), encoding="utf-8")

          ta = Path("frontend/unified-hub/ta/app.js")
          text = ta.read_text(encoding="utf-8")
          old = '|| "http://127.0.0.1:5000/api"'
          new = '|| "http://127.0.0.1:8765/api"'
          if old not in text:
              raise SystemExit("Unified Hub TA API base URL source not found")
          ta.write_text(text.replace(old, new, 1), encoding="utf-8")

          backend = Path("backend/server.py")
          text = backend.read_text(encoding="utf-8")
          if "http://127.0.0.1:8766" not in text:
              start = text.find("allow_origins")
              bracket = text.find("[", start)
              if start < 0 or bracket < 0:
                  raise SystemExit("Could not locate backend CORS allow_origins list")
              additions = '\n        "http://127.0.0.1:8766", "http://localhost:8766",'
              text = text[:bracket + 1] + additions + text[bracket + 1:]
              backend.write_text(text, encoding="utf-8")
          PY
          grep -q "127.0.0.1:8766" frontend/unified-hub/app.js
          grep -q "127.0.0.1:8765/api" frontend/unified-hub/ta/app.js
          grep -q "http://127.0.0.1:8766" backend/server.py
          if find frontend/new-era -type f \( -iname '*.p12' -o -iname '*bitlocker*' \) | grep -q .; then
            echo "Refusing to package a signing key or recovery-key file."
            exit 1
          fi
          echo "Unified Hub, New Era v16, 15+ tools, PromptVault/RVC resources, and local API ports staged."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Python 3.12 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python for Chaquopy
        run: python --version && python3.12 --version

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK with bundled ARM64 engine
        working-directory: android-native
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK, native engine, and app assets
        run: |
          set -euo pipefail
          APK="android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.unifiedstudio.localsd' versionCode='1' versionName='1.2.0'"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libsd-server.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libsdserver_cxx.so"
          unzip -l "$APK" | grep -F "assets/frontend/user_studios/index.html"
          unzip -l "$APK" | grep -F "assets/frontend/user_studios/Stable_Diffusion_Mobile_PRO_v14.html"
          unzip -l "$APK" | grep -F "assets/guides/PromptVault-Pro-Complete-Visual-Guide-AR-FINAL.pdf"
          unzip -l "$APK" | grep -F "assets/guides/RVC-Voice-Cloning-Mobile-Guide-AR.pdf"
          unzip -l "$APK" | grep -F "assets/frontend/unified-hub/index.html"
          unzip -l "$APK" | grep -F "assets/frontend/new-era/unified-launcher.html"
          unzip -l "$APK" | grep -F "assets/frontend/new-era/resources/uvs-vault-2026-11-18.json"
          unzip -l "$APK" | grep -F "assets/frontend/new-era/resources/SKILL.md"
          unzip -l "$APK" | grep -F "assets/frontend/new-era/tools/PromptVault-Pro-Ultimate-Bilingual-v13-RVC-Integrated.html"
          unzip -l "$APK" | grep -F "assets/frontend/new-era/resources/Ultimate_ChatGPT_Prompt_Library.pdf"
          unzip -l "$APK" | grep -F "assets/frontend/new-era/resources/Free_AI_Face_Swap_Web_Archive.mht"
          TOOL_COUNT="$(unzip -Z1 "$APK" | grep -cE '^assets/frontend/new-era/tools/.*\.html$' || true)"
          test "$TOOL_COUNT" -ge 15
          if unzip -Z1 "$APK" | grep -E '^assets/native/arm64-v8a/sd-server$'; then
            echo "ERROR: native engine was packaged as an asset instead of a native library."
            exit 1
          fi
          sha256sum "$APK"
          file "$APK"

          # Verify every committed studio file is present and all local launcher
          # links resolve to an existing source file.
          python - <<'PY'
          import os, zipfile
          from html.parser import HTMLParser
          root = "frontend/user_studios"
          apk = "android-native/app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(apk) as z:
              packaged = set(z.namelist())
              source_files = []
              for base, _, files in os.walk(root):
                  for filename in files:
                      rel = os.path.relpath(os.path.join(base, filename), root).replace(os.sep, "/")
                      source_files.append(rel)
              missing = [rel for rel in source_files if "assets/frontend/user_studios/" + rel not in packaged]
              if missing:
                  raise SystemExit("APK missing committed studio files: " + ", ".join(missing))
              with open(os.path.join(root, "index.html"), encoding="utf-8") as f:
                  html = f.read()
              class LinkParser(HTMLParser):
                  def __init__(self):
                      super().__init__()
                      self.links = []
                  def handle_starttag(self, tag, attrs):
                      if tag.lower() == "a":
                          self.links.extend(value for key, value in attrs if key.lower() == "href" and value)
              parser = LinkParser()
              parser.feed(html)
              broken = []
              for href in parser.links:
                  if href.startswith(("http://", "https://", "mailto:", "tel:", "#", "javascript:")):
                      continue
                  target = os.path.normpath(os.path.join(root, href.split("?", 1)[0].split("#", 1)[0]))
                  if not os.path.isfile(target):
                      broken.append(href)
              if broken:
                  raise SystemExit("Broken local launcher links: " + ", ".join(broken))
              print(f"Studio packaging check passed: {len(source_files)} source files, {len(parser.links)} launcher links.")
          PY

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: unified-studio-native-android-arm64-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the verified native APK
        uses: actions/download-artifact@v4
        with:
          name: unified-studio-native-android-arm64-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery

      - name: ARM64 Android runtime, API health and startup performance test
        timeout-minutes: 20
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -gpu swiftshader_indirect -no-snapshot -no-snapshot-save
          script: |
            set -euo pipefail
            APK="delivery/app-debug.apk"
            test -s "$APK"
            adb install -r "$APK"
            START_OUTPUT="$(adb shell am start -W -n com.unifiedstudio.localsd/com.unifiedstudio.android.MainActivity 2>&1)"
            printf '%s\n' "$START_OUTPUT"
            TOTAL_MS="$(printf '%s\n' "$START_OUTPUT" | awk -F: '/TotalTime/ {gsub(/[^0-9]/,"",$2); print $2; exit}')"
            test -n "$TOTAL_MS"
            test "$TOTAL_MS" -le 120000
            adb shell pidof com.unifiedstudio.localsd
            adb forward tcp:18765 tcp:8765
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error http://127.0.0.1:18765/api/status -o /tmp/unified-studio-api-status.json; then
                break
              fi
              sleep 1
            done
            test -s /tmp/unified-studio-api-status.json
            cat /tmp/unified-studio-api-status.json
            adb forward tcp:18766 tcp:8766
            SD_CODE="000"
            for attempt in $(seq 1 60); do
              SD_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 http://127.0.0.1:18766/ || true)"
              if [[ "$SD_CODE" =~ ^[1-5][0-9][0-9]$ ]]; then
                break
              fi
              sleep 1
            done
            test "$SD_CODE" != "000"
            PSS_KB="$(adb shell dumpsys meminfo com.unifiedstudio.localsd | awk '/TOTAL PSS/ {print $3; exit}')"
            if [ -z "$PSS_KB" ]; then PSS_KB=unknown; fi
            adb logcat -d -t 2000 > /tmp/unified-studio-logcat.txt
            if grep -F "Process: com.unifiedstudio.localsd, PID" /tmp/unified-studio-logcat.txt; then
              echo "Android runtime smoke test detected a fatal app crash."
              exit 1
            fi
            echo "ARM64 runtime passed: Activity TotalTime=$TOTAL_MS ms; PSS=$PSS_KB KB; SD HTTP=$SD_CODE."

      - name: Upload ARM64 runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/unified-studio-logcat.txt
            /tmp/unified-studio-api-status.json
          if-no-files-found: warn
          retention-days: 7

  web-tool-smoke:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: unified-studio-native-android-arm64-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery

      - name: Extract packaged frontend
        run: |
          set -euo pipefail
          mkdir -p app
          unzip -q delivery/app-debug.apk 'assets/frontend/*' -d app
          test -s app/assets/frontend/index.html
          test -s app/assets/frontend/new-era/unified-launcher.html
          test -s app/assets/frontend/guides/PromptVault-Pro-Complete-Visual-Guide-AR-FINAL.pdf
          test -s app/assets/frontend/guides/RVC-Voice-Cloning-Mobile-Guide-AR.pdf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Open every packaged HTML page in Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory app/assets/frontend --bind 127.0.0.1 >/tmp/frontend-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          cat > qa-web-smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('app/assets/frontend');
          const files = [];
          function walk(dir) {
            for (const item of fs.readdirSync(dir, {withFileTypes:true})) {
              const full = path.join(dir, item.name);
              if (item.isDirectory()) walk(full);
              else if (item.isFile() && item.name.toLowerCase().endsWith('.html')) files.push(full);
            }
          }
          walk(root);
          files.sort();
          (async () => {
            const browser = await chromium.launch({headless:true});
            const errors = [];
            let opened = 0;
            try {
              const context = await browser.newContext({serviceWorkers:'block'});
              for (const file of files) {
                const page = await context.newPage();
                page.on('pageerror', error => errors.push(path.relative(root,file)+': '+error.message));
                await page.route('**/promptvault', route => route.fulfill({path:'app/assets/frontend/promptvault.html'}));
                await page.route('http://127.0.0.1:8765/api/**', route => {
                  const endpoint = new URL(route.request().url()).pathname;
                  let data = {};
                  if (endpoint.endsWith('/config')) data = {horde_models:[],style_presets:[],agents:[],character_options:{},clothes_options:{}};
                  else if (endpoint.endsWith('/talent/jobs')) data = {jobs:[]};
                  else if (endpoint.endsWith('/status')) data = {status:'healthy'};
                  return route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:JSON.stringify(data)});
                });
                try {
                  const rel = path.relative(root,file).split(path.sep).join('/');
                  const response = await page.goto('http://127.0.0.1:4173/'+rel,{waitUntil:'domcontentloaded',timeout:20000});
                  if (!response || !response.ok()) errors.push(rel+': HTTP '+(response?response.status():'no response'));
                  await page.waitForTimeout(500);
                  const state = await page.locator('body').evaluate(el => ({text:el.innerText.length,children:el.children.length}));
                  if (!state.children) errors.push(rel+': empty body');
                  opened++;
                } catch (error) {
                  errors.push(path.relative(root,file)+': navigation '+error.message);
                }
                await page.close();
              }
              console.log('HTML pages opened:',opened,'/',files.length);
              console.log('Uncaught browser page errors:',errors.length);
              for (const error of errors) console.log('FAIL',error);
              if (opened !== files.length || errors.length) process.exitCode=1;
            } finally { await browser.close(); }
          })().catch(error => { console.error(error); process.exit(1); });
          JS
          node qa-web-smoke.cjs
