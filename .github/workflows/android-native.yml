name: Build native Unified Studio Android APK

on:
  push:
    paths:
      - "android-native/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/android-native.yml"
  workflow_run:
    workflows: ["Build Stable Diffusion Android ARM64 Engine"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Download compiled ARM64 engine
        uses: actions/download-artifact@v4
        with:
          name: stable-diffusion-android-arm64-cpu
          path: downloaded-engine
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || 45183107657 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare executable native libraries for Android
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y patchelf
          set -x
          find downloaded-engine -maxdepth 4 -type f -ls
          OUTER="$(find downloaded-engine -type f -name 'stable-diffusion-android-arm64-cpu.zip' -print -quit)"
          test -n "$OUTER"
          test -s "$OUTER"
          echo "Using engine artifact file: $OUTER"
          mkdir -p /tmp/sd-engine/outer /tmp/sd-engine/inner
          unzip -q "$OUTER" -d /tmp/sd-engine/outer
          INNER="/tmp/sd-engine/outer/stable-diffusion-android-arm64-cpu.zip"
          test -s "$INNER"
          unzip -q "$INNER" -d /tmp/sd-engine/inner
          NATIVE="/tmp/sd-engine/inner/native/arm64-v8a"
          BIN="$NATIVE/sd-server"
          test -s "$BIN"
          test -x "$BIN"

          if test -s "$NATIVE/libc++_shared.so"; then
            mv "$NATIVE/libc++_shared.so" "$NATIVE/libsdserver_cxx.so"
            patchelf --set-soname libsdserver_cxx.so "$NATIVE/libsdserver_cxx.so"
            patchelf --replace-needed libc++_shared.so libsdserver_cxx.so "$BIN"
          fi
          test -s "$NATIVE/libsdserver_cxx.so"
          readelf -d "$BIN" | grep -F "libsdserver_cxx.so"
          ! readelf -d "$BIN" | grep -F "libc++_shared.so"

          mkdir -p android-native/app/src/main/jniLibs/arm64-v8a
          cp "$BIN" android-native/app/src/main/jniLibs/arm64-v8a/libsd-server.so
          cp "$NATIVE/libsdserver_cxx.so" android-native/app/src/main/jniLibs/arm64-v8a/libsdserver_cxx.so
          chmod 755 android-native/app/src/main/jniLibs/arm64-v8a/libsd-server.so
          chmod 755 android-native/app/src/main/jniLibs/arm64-v8a/libsdserver_cxx.so
          file android-native/app/src/main/jniLibs/arm64-v8a/libsd-server.so

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Python 3.12 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python for Chaquopy
        run: python --version && python3.12 --version

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: android-native
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify final APK contents
        run: |
          set -euo pipefail
          APK="android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F "assets/guides/PromptVault-Pro-Complete-Visual-Guide-AR-FINAL.pdf"
          unzip -l "$APK" | grep -F "assets/guides/RVC-Voice-Cloning-Mobile-Guide-AR.pdf"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libsd-server.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libsdserver_cxx.so"
          unzip -l "$APK" | grep -F "assets/frontend/user_studios/index.html"
          unzip -l "$APK" | grep -F "assets/frontend/user_studios/Stable_Diffusion_Mobile_PRO_v14.html"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unified-studio-native-android-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
