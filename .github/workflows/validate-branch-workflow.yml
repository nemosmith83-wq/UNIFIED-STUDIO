name: Temporary actionlint check for uploaded-assets branch retry2

on:
  push:
    paths:
      - ".github/workflows/validate-branch-workflow.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout uploaded-assets branch
        uses: actions/checkout@v4
        with:
          ref: complete-uploaded-assets
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: Lint uploaded-assets workflow
        run: "$(go env GOPATH)/bin/actionlint .github/workflows/android-integrated-1.2.0.yml"
