name: Temporary actionlint check for uploaded-assets branch

on:
  push:
    paths:
      - ".github/workflows/validate-branch-workflow.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout uploaded-assets branch
        uses: actions/checkout@v4
        with:
          ref: complete-uploaded-assets
      - name: Lint workflow files
        uses: reviewdog/actionlint@v1
        with:
          actionlint_flags: -color
