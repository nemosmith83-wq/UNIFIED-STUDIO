name: Android Web Shell APK

on:
  push:
    paths:
      - "frontend/**"
      - "unified_studio_dashboard.html"
      - ".github/workflows/android-web-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-web-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp -R frontend/. www/
          cp unified_studio_dashboard.html www/dashboard.html
          cat > package.json <<'JSON'
          {
            "name": "unified-studio-android-shell",
            "version": "1.0.0",
            "private": true,
            "description": "Android WebView shell for the Unified Studio frontend",
            "dependencies": {
              "@capacitor/android": "^7.4.3",
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.unifiedstudio.app",
            "appName": "Unified Studio",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          JSON
          npm install

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: unified-studio-android-web-shell-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
