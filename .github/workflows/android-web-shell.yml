# Requested rebuild: v16 integrated Android APK, initiated 2026-11-24
name: Android Web Shell APK

on:
  push:
    paths:
      - ".github/workflows/android-web-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-web-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download original v16 source archive
        run: |
          curl --fail --location --retry 3 --output source-v16.zip "https://nemo1sthelper.floot.app/_cdn/static/39c5ed47-f0fc-40dd-bdc8-8b23c5ea43ab-UVS_Fadel_v16_source.zip"
          unzip -t source-v16.zip
          mkdir -p www
          unzip -q source-v16.zip -d www
          test -s www/index.html
          echo "Verified original v16 entry point:"
          ls -lh www/index.html

      - name: Create Capacitor Android wrapper
        run: |
          cat > package.json <<'JSON'
          {
            "name": "unified-studio-v16-android",
            "version": "16.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.4.3",
              "@capacitor/core": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.fadel.unifiedstudio",
            "appName": "Unified Studio",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          JSON
          npm install
          npx cap add android
          npx cap sync android

      - name: Build installable Android APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Unified-Studio-v16-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
