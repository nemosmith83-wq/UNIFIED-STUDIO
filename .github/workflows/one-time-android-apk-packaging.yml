name: One-time corrected Android APK packaging

on:
  push:
    paths:
      - ".github/workflows/one-time-android-apk-packaging.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download previously compiled ARM64 engine
        uses: actions/download-artifact@v4
        with:
          name: stable-diffusion-android-arm64-cpu
          path: downloaded-engine
          run-id: 45183107657
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package native engine into Android native libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y patchelf
          OUTER="$(find downloaded-engine -type f -name 'stable-diffusion-android-arm64-cpu.zip' -print -quit)"
          test -n "$OUTER" && test -s "$OUTER"
          mkdir -p /tmp/sd-engine
          unzip -q "$OUTER" -d /tmp/sd-engine
          NATIVE="/tmp/sd-engine/native/arm64-v8a"
          test -x "$NATIVE/sd-server"
          test -s "$NATIVE/libc++_shared.so"
          mv "$NATIVE/libc++_shared.so" "$NATIVE/libsdserver_cxx.so"
          patchelf --set-soname libsdserver_cxx.so "$NATIVE/libsdserver_cxx.so"
          patchelf --replace-needed libc++_shared.so libsdserver_cxx.so "$NATIVE/sd-server"
          readelf -h "$NATIVE/sd-server" | grep -F "AArch64"
          readelf -d "$NATIVE/sd-server" | grep -F "libsdserver_cxx.so"
          DEST="android-native/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          cp "$NATIVE/sd-server" "$DEST/libsd-server.so"
          cp "$NATIVE/libsdserver_cxx.so" "$DEST/libsdserver_cxx.so"
          chmod 755 "$DEST"/*.so

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: android-native
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK contains executable engine and app resources
        run: |
          set -euo pipefail
          APK="android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libsd-server.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libsdserver_cxx.so"
          unzip -l "$APK" | grep -F "assets/frontend/user_studios/Stable_Diffusion_Mobile_PRO_v14.html"
          ! unzip -l "$APK" | grep -F "assets/native/arm64-v8a/sd-server"
          sha256sum "$APK"

      - name: Upload corrected APK
        uses: actions/upload-artifact@v4
        with:
          name: unified-studio-native-android-debug-corrected
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
